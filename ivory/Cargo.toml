[package]
name = "ivory"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[features]
learning = ["ivory-core/learning"]

[dependencies]
ivory-core = { path = "../ivory-core" }
# Same crate eframe already links; direct dep so modules can `use egui::...`.
egui = { version = "0.35", default-features = false }
eframe = { version = "0.35", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
midir = "0.11"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
dirs = "6"
fd-lock = "4"

[dev-dependencies]
ttf-parser = "0.25"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
