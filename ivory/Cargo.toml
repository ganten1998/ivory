[package]
# The CRATE keeps the codename. "Ivory" stays the internal name throughout:
# crate names, ~/.config/ivory/, the macOS bundle id, the settings and override
# file paths, and the IVORY_* developer switches. Changing any of those would
# reset Gatekeeper trust and orphan every existing user's settings for nothing,
# since none of it is visible to anyone using the app.
name = "ivory"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = "build.rs"

# The BINARY carries the product name, because users type it, see it in a
# process list, and read it in the Linux tarball.
[[bin]]
name = "tangent"
path = "src/main.rs"

[dependencies]
# The GUI always enables the engine's `learning` feature — the re-ranker is a
# user-facing option now, and it stays inert (adjustment exactly 0.0) until the
# user turns Chord Learning on AND has trained weights. Keeping it a feature of
# ivory-core alone means `cargo test -p ivory-core` still exercises the stock
# engine path, while every packaged binary ships the option.
# `license` MUST be listed here: without it ivory-core compiles the no-op
# verification stub and the shipped app silently rejects every valid key while
# every test still passes. `tests/license_feature.rs` guards this.
ivory-core = { path = "../ivory-core", features = ["learning", "license"] }
# The shared GUI. Everything the plugin will also link lives here; this crate
# keeps only what genuinely belongs to a desktop binary — the window, the MIDI
# device, the single-instance lock, the CLI.
ivory-ui = { path = "../ivory-ui" }
# Same crate eframe already links; direct dep so modules can `use egui::...`.
egui = { version = "0.33", default-features = false }
eframe = { version = "0.33", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
# Already in the tree via eframe; taken as a direct dep so the app can install
# a logger and surface the warnings eframe/glutin emit while probing for a GL
# context. Without one those go nowhere and a startup failure reports only the
# LAST thing that broke.
log = "0.4"
midir = "0.11"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
dirs = "6"
fd-lock = "4"

[dev-dependencies]
ttf-parser = "0.25"

# No build-dependencies. `build.rs` shells out to whichever resource compiler
# is present rather than taking `winres`, because the dependency has to be
# chosen by the TARGET and cargo selects build-dependencies by the HOST — which
# is why the old `[target.'cfg(windows)'.build-dependencies] winres` never once
# ran for a Windows build cross-compiled from macOS, and why every shipped
# tangent.exe has no icon.

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console", "Win32_UI_WindowsAndMessaging"] }


[lints]
workspace = true
